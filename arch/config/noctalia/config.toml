[backdrop]
enabled = false

[bar.main]
background_opacity = 0.0
capsule = false
center = ["group:pulse"]
contact_shadow = false
end = ["group:signal"]
margin_edge = 10
margin_ends = 18
padding = 6
shadow = false
start = ["group:lunar"]
thickness = 40
widget_spacing = 8

[[bar.main.capsule_group]]
border = "outline_variant"
fill = "surface_container"
foreground = "on_surface"
id = "lunar"
members = ["wallpaper", "workspaces", "clock"]
opacity = 0.56
padding = 10
radius = 12
widget_spacing = 8

[[bar.main.capsule_group]]
border = "outline_variant"
fill = "surface_container"
foreground = "on_surface"
id = "pulse"
members = ["audio_visualizer", "media", "audio_visualizer"]
opacity = 0.62
padding = 12
radius = 14
widget_spacing = 8

[[bar.main.capsule_group]]
border = "outline_variant"
fill = "surface_container"
foreground = "on_surface"
id = "signal"
members = ["tray", "notifications", "cpu", "ram", "volume", "network", "session"]
opacity = 0.56
padding = 10
radius = 12
widget_spacing = 8

[osd]
background_opacity = 0.85
offset_y = 14
orientation = "horizontal"
position = "top_center"
scale = 1.0

[osd.kinds]
bluetooth = true
brightness = true
volume = true
volume_input = true
volume_output = true
wifi = true

[shell]
app_icon_color = "secondary"
button_borders = false
card_borders = false
corner_radius_scale = 0.88
font_family = "JetBrainsMono Nerd Font"
lang = "ru"

[shell.launcher]
colorize_icons = true

[shell.panel]
borders = true
control_center_placement = "floating"
floating_layer = "top"
shadow = true
transparency_mode = "glass"
wallpaper_position = "center"

[shell.screenshot]
copy_to_clipboard = false
freeze_screen = true
pipe_command = "satty --filename - --fullscreen --output-filename __HOME__/Pictures/Screenshots/Screenshot-%Y-%m-%d_%H-%M-%S.png"
pipe_to_command = true
save_to_file = false

[shell.window_switcher]
colorize_icons = true

[theme]
custom_palette = "Nullscapes"
mode = "dark"
source = "custom"

[widget.audio_visualizer]
bands = 20
centered = true
color = "secondary"
color_1 = "#678FE4"
color_2 = "#AB66CC"
mirrored = true
reversed = false
show_when_idle = true
width = 56

[widget.clock]
color = "secondary"

[widget.cpu]
color = "secondary"
icon_color = "secondary"

[widget.network]
color = "secondary"
icon_color = "secondary"
show_label = false

[widget.ram]
color = "secondary"
icon_color = "secondary"

[widget.tray]
color = "secondary"
colorize_icons = true
icon_color = "secondary"

[widget.workspaces]
colorize_icons = true
show_labels = false
